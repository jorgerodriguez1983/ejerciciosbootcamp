<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejecutar Función con boton</title>
    <script>
        // Definir la función miFuncion
        function miFuncion() {
            alert("¡Has hecho clic en el botón!");
        }
    </script>
</head>

<body>
    <!-- Botón que ejecuta la función miFuncion al hacer clic -->
    <button onclick="miFuncion()">Haz clic aquí</button>
</body>

</html>
